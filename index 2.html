<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b4933">
<title>My Life Log</title>
<style>
:root{--bg:#f4ecdf;--paper:#fffaf1;--ink:#493629;--muted:#8b7665;--accent:#6b4933;--line:#e5d7c5}
@media(prefers-color-scheme:dark){:root{--bg:#211b17;--paper:#302720;--ink:#f2e7d8;--muted:#c0aa94;--accent:#c49a72;--line:#514235}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
header{padding:28px 20px 22px;background:linear-gradient(135deg,#76563e,#493326);color:white}
header small{letter-spacing:.14em;opacity:.8}
h1{font:bold 28px Georgia,serif;margin:8px 0}
header p{margin:0;font-size:13px;opacity:.85}
main{max-width:700px;margin:auto;padding:18px 14px 105px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:14px}
h2{font:bold 19px Georgia,serif;margin:0 0 14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:125px;resize:vertical}
button{border:0;border-radius:11px;background:var(--accent);color:white;padding:12px 16px;font:inherit;font-weight:600}
.secondary{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.entry{border-top:1px solid var(--line);padding:13px 0}
.entry time{font-size:12px;color:var(--muted)}
.entry h3{margin:5px 0}
.entry p{white-space:pre-wrap;line-height:1.6}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--paper);border-top:1px solid var(--line);padding:10px 3px calc(10px + env(safe-area-inset-bottom))}
nav button{background:transparent;color:var(--ink);font-size:12px;padding:8px}
.hidden{display:none}
</style>
</head>
<body>
<header><small>MY PERSONAL JOURNAL</small><h1>My Life Log</h1><p>日々の小さな記録を、未来の自分へ。</p></header>
<main>
<section id="home" class="panel">
<h2>今日の記録</h2><div class="hint" id="today"></div>
<div class="actions"><button onclick="show('write')">＋ 日記を書く</button><button class="secondary" onclick="show('records')">記録を読み返す</button></div>
</section>
<section id="write" class="panel hidden">
<h2>日記を書く</h2>
<label>日付</label><input id="date" type="date">
<label>タイトル（任意）</label><input id="title" maxlength="80" placeholder="今日の出来事">
<label>本文</label><textarea id="body" placeholder="今日あったこと、感じたことを書いてみよう"></textarea>
<label>カテゴリー</label><select id="category">
<option>日常</option><option>仕事</option><option>外食・食事</option><option>お出掛け・旅行</option><option>趣味</option><option>家庭・家族</option><option>買い物</option><option>お金・家計</option><option>健康</option><option>その他</option>
</select>
<label>今日の気分（任意）</label><select id="mood"><option value="">選択しない</option><option>😄 良い日</option><option>😐 普通の日</option><option>😞 悪い日</option></select>
<div class="actions"><button onclick="saveEntry()">保存する</button><button class="secondary" onclick="show('home')">戻る</button></div>
<p id="notice" class="hint"></p>
</section>
<section id="records" class="panel hidden"><h2>日記一覧</h2><div id="list" class="hint">まだ記録はありません。</div></section>
<section id="about" class="panel hidden">
<h2>試作品について</h2>
<p class="hint">これは画面と基本操作を確認するための試作品です。記録はこのブラウザ内に保存されます。Google Driveへの保存・写真・バックアップはまだ接続していません。大切な日記はまだ入力しないでください。</p>
</section>
</main>
<nav>
<button onclick="show('home')">⌂<br>ホーム</button><button onclick="show('write')">＋<br>日記を書く</button><button onclick="show('records')">▤<br>記録</button><button onclick="show('about')">ⓘ<br>説明</button>
</nav>
<script>
const $=id=>document.getElementById(id);
const now=new Date();
const today=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);
$('today').textContent=new Intl.DateTimeFormat('ja-JP',{dateStyle:'long',weekday:'long'}).format(now);
$('date').value=today;
function show(id){['home','write','records','about'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='records')render()}
function entries(){try{return JSON.parse(localStorage.getItem('mll_entries')||'[]')}catch(e){return []}}
function saveEntry(){
 const body=$('body').value.trim(),title=$('title').value.trim();
 if(!body&&!title){$('notice').textContent='タイトルか本文を入力してね。';return}
 const a=entries();a.unshift({date:$('date').value,title,body,category:$('category').value,mood:$('mood').value});
 try{localStorage.setItem('mll_entries',JSON.stringify(a));$('title').value='';$('body').value='';$('mood').value='';$('notice').textContent='このブラウザに保存したよ。';show('records')}
 catch(e){$('notice').textContent='保存できなかったよ。'}
}
function render(){
 const a=entries(),root=$('list');root.replaceChildren();
 if(!a.length){root.textContent='まだ記録はありません。';return}
 a.forEach(e=>{const d=document.createElement('article');d.className='entry';const t=document.createElement('time');t.textContent=e.date+' ・ '+e.category+' '+e.mood;const h=document.createElement('h3');h.textContent=e.title||'（タイトルなし）';const p=document.createElement('p');p.textContent=e.body;d.append(t,h,p);root.append(d)})
}
</script>
</body>
</html>
